<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clarin Music Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --blue:        #1e3a8a;
    --blue-med:    #2563eb;
    --blue-light:  #dbeafe;
    --blue-bg:     #eff6ff;
    --gold:        #92400e;
    --gold-med:    #d97706;
    --gold-bright: #f59e0b;
    --gold-light:  #fef3c7;
    --gold-bg:     #fffbeb;
    --navy:        #0f172a;
    --paper:       #f8fafc;
    --border:      #bfdbfe;
    --muted:       #64748b;
    --white:       #ffffff;
    --shadow:      0 4px 24px rgba(30,58,138,.12);
    --shadow-lg:   0 12px 48px rgba(30,58,138,.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--paper);
    color: var(--navy);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Background */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 70% 50% at 0% 0%, rgba(30,58,138,.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 100% 100%, rgba(245,158,11,.07) 0%, transparent 60%);
    pointer-events: none; z-index: 0;
  }

  .page {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 2rem 1.5rem 3rem; position: relative; z-index: 1;
  }

  /* Brand */
  .brand { text-align: center; margin-bottom: 2.5rem; }
  .logo-wrap {
    width: 110px; height: 110px;
    background: #fff; border-radius: 28px;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-lg);
    margin-bottom: 1.25rem; overflow: hidden;
    border: 2px solid var(--gold-light);
  }
  .logo-wrap img { width: 96px; height: 96px; object-fit: contain; }
  .logo-fallback {
    width: 96px; height: 96px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--blue) 0%, var(--blue-med) 100%);
    border-radius: 20px;
  }
  .logo-fallback span { font-size: 42px; }
  .brand-name {
    font-family: 'Playfair Display', serif;
    font-size: clamp(22px, 5vw, 32px);
    color: var(--blue);
    line-height: 1.15;
    margin-bottom: 5px;
    letter-spacing: -.01em;
  }
  .brand-sub {
    font-size: 12px; color: var(--muted);
    letter-spacing: .12em; text-transform: uppercase; font-weight: 500;
  }

  /* Login box */
  .login-box {
    background: #fff; border-radius: 20px;
    border: 1.5px solid var(--border);
    box-shadow: var(--shadow);
    padding: 2rem 1.75rem;
    width: 100%; max-width: 420px;
  }
  .login-title {
    font-size: 14px; font-weight: 600;
    color: var(--muted); letter-spacing: .07em;
    text-transform: uppercase; text-align: center;
    margin-bottom: 1.5rem;
  }

  /* Role cards */
  .roles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1.5rem; max-width: 300px; margin-left: auto; margin-right: auto; }
  .role-card {
    display: flex; flex-direction: column; align-items: center;
    gap: 8px; padding: 14px 10px;
    border: 2px solid var(--border); border-radius: 14px;
    background: var(--paper); cursor: pointer;
    transition: all .18s; text-align: center;
  }
  .role-card:hover { border-color: var(--blue-med); background: var(--blue-bg); }
  .role-card.active {
    border-color: var(--blue-med); background: var(--blue-bg);
    box-shadow: 0 0 0 3px rgba(37,99,235,.15);
  }
  .role-card .icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .role-card.admin .icon  { background: var(--blue-light); }
  .role-card.guru .icon   { background: var(--gold-light); }
  .role-card .label { font-size: 12px; font-weight: 600; color: var(--navy); }
  .role-card .sublabel { font-size: 10px; color: var(--muted); }

  /* PIN form */
  .pin-section { display: none; }
  .pin-section.show { display: block; }
  .pin-label {
    font-size: 12px; font-weight: 500; color: var(--muted);
    margin-bottom: 6px; display: block;
    letter-spacing: .05em; text-transform: uppercase;
  }
  .pin-input-wrap { position: relative; margin-bottom: 10px; }
  .pin-input-wrap input {
    width: 100%; padding: 11px 42px 11px 14px;
    border: 1.5px solid var(--border); border-radius: 10px;
    font-family: 'Inter', sans-serif; font-size: 15px; color: var(--navy);
    background: var(--paper); outline: none;
    transition: border-color .15s, box-shadow .15s;
    letter-spacing: .1em;
  }
  .pin-input-wrap input:focus {
    border-color: var(--blue-med);
    box-shadow: 0 0 0 3px rgba(37,99,235,.14);
    background: #fff;
  }
  .pin-toggle {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    font-size: 16px; color: var(--muted); padding: 4px;
  }

  /* Guru extra field */
  .extra-field { margin-bottom: 10px; display: none; }
  .extra-field.show { display: block; }
  .extra-field input {
    width: 100%; padding: 10px 14px;
    border: 1.5px solid var(--border); border-radius: 10px;
    font-family: 'Inter', sans-serif; font-size: 14px; color: var(--navy);
    background: var(--paper); outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .extra-field input:focus {
    border-color: var(--blue-med);
    box-shadow: 0 0 0 3px rgba(37,99,235,.14);
    background: #fff;
  }
  .extra-field input::placeholder { color: #94a3b8; }

  .btn-login {
    width: 100%; padding: 12px;
    border-radius: 10px; border: none;
    background: linear-gradient(135deg, var(--blue) 0%, var(--blue-med) 100%);
    color: #fff; font-family: 'Inter', sans-serif;
    font-size: 14px; font-weight: 600;
    cursor: pointer; letter-spacing: .03em;
    transition: opacity .15s, transform .1s;
    box-shadow: 0 4px 14px rgba(30,58,138,.3);
  }
  .btn-login:hover { opacity: .92; }
  .btn-login:active { transform: scale(.98); }
  .btn-login.gold {
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-med) 100%);
    box-shadow: 0 4px 14px rgba(217,119,6,.3);
  }
  .btn-login.green {
    background: linear-gradient(135deg, #065f46 0%, #059669 100%);
    box-shadow: 0 4px 14px rgba(5,150,105,.3);
  }

  .err-msg {
    display: none; color: #dc2626;
    font-size: 12px; font-weight: 500;
    margin-top: 8px; text-align: center;
  }
  .err-msg.show { display: block; }

  footer {
    text-align: center; padding: 1.5rem;
    font-size: 11px; color: var(--muted);
    letter-spacing: .08em; position: relative; z-index: 1;
  }

  @media (max-width: 420px) {
    .login-box { padding: 1.5rem 1.25rem; }
    .roles { gap: 7px; }
    .role-card { padding: 12px 6px; }
    .role-card .icon { width: 38px; height: 38px; font-size: 18px; }
  }
</style>
</head>
<body>

<div class="page">

  <div class="brand">
    <div class="logo-wrap">
      <img src="logo.jpeg" alt="Clarin Music Studio"
        onerror="this.outerHTML='<div class=\'logo-fallback\'><span>🎹</span></div>'">
    </div>
    <div class="brand-name">Clarin Music Studio</div>
    <div class="brand-sub">Portal Management</div>
  </div>

  <div class="login-box">
    <div class="login-title">Masuk sebagai</div>

    <!-- Role selector -->
    <div class="roles">
      <div class="role-card admin" onclick="selectRole('admin')">
        <div class="icon">⚙️</div>
        <div class="label">Admin</div>
        <div class="sublabel">Dashboard</div>
      </div>
      <div class="role-card guru" onclick="selectRole('guru')">
        <div class="icon">🎹</div>
        <div class="label">Guru</div>
        <div class="sublabel">Portal Guru</div>
      </div>
    </div>
    <div style="text-align:center;font-size:11px;color:var(--muted);margin-bottom:1.25rem;">
      🔗 Portal orang tua diakses via link unik yang dikirim admin
    </div>

    <!-- PIN section -->
    <div class="pin-section" id="pinSection">

      <!-- Guru: email/nama field -->
      <div class="extra-field" id="extraField">
        <input type="text" id="extraInput" placeholder="Email atau nama guru..." autocomplete="off">
      </div>

      <label class="pin-label" id="pinLabel">PIN</label>
      <div class="pin-input-wrap">
        <input type="password" id="pinInput" placeholder="••••••" autocomplete="off"
          oninput="clearErr()" onkeydown="if(event.key==='Enter')doLogin()">
        <button class="pin-toggle" onclick="togglePin()">👁</button>
      </div>

      <button class="btn-login" id="btnLogin" onclick="doLogin()">Masuk</button>
      <div class="err-msg" id="errMsg">PIN salah atau akun tidak ditemukan</div>
    </div>

  </div>
</div>

<footer>Clarin Music Studio &nbsp;·&nbsp; © 2025</footer>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
// Ganti dengan URL Apps Script kamu setelah deploy
const API_URL = localStorage.getItem('cms_api_url') || 'https://script.google.com/macros/s/AKfycbzPpSbA6WiTf7YGHcmArdJk-MEPzbuZe7sWj-lp6a9pgtj2try4uCbxcINWSHAI4XfDxQ/exec';

let selectedRole = null;

function selectRole(role) {
  selectedRole = role;
  document.querySelectorAll('.role-card').forEach(c => c.classList.remove('active'));
  document.querySelector(`.role-card.${role}`).classList.add('active');
  document.getElementById('pinSection').classList.add('show');
  document.getElementById('errMsg').classList.remove('show');
  document.getElementById('pinInput').value = '';

  const label = document.getElementById('pinLabel');
  const extra = document.getElementById('extraField');
  const btn   = document.getElementById('btnLogin');
  const lbl   = document.getElementById('extraInput');

  if (role === 'guru') {
    extra.classList.add('show');
    lbl.placeholder = 'Email atau nama guru...';
    label.textContent = 'PIN Guru';
    btn.className = 'btn-login gold';
  } else {
    extra.classList.remove('show');
    label.textContent = 'PIN Admin';
    btn.className = 'btn-login';
  }

  setTimeout(() => {
    (role !== 'admin'
      ? document.getElementById('extraInput')
      : document.getElementById('pinInput')
    ).focus();
  }, 80);
}

function togglePin() {
  const inp = document.getElementById('pinInput');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

function clearErr() {
  document.getElementById('errMsg').classList.remove('show');
}

async function doLogin() {
  if (!selectedRole) return;
  const pin   = document.getElementById('pinInput').value.trim();
  const extra = document.getElementById('extraInput').value.trim();
  if (!pin) { showErr('Masukkan PIN dulu ya'); return; }

  const btn = document.getElementById('btnLogin');
  btn.textContent = 'Memeriksa...';
  btn.disabled = true;

  try {
    if (selectedRole === 'admin') {
      const ok = await checkAdmin(pin);
      if (ok) {
        sessionStorage.setItem('cms_role', 'admin');
        sessionStorage.setItem('cms_pin', pin);
        window.location.href = 'admin.html';
      } else {
        showErr('PIN admin salah');
      }
    } else if (selectedRole === 'guru') {
      if (!extra) { showErr('Masukkan email/nama guru'); btn.textContent='Masuk'; btn.disabled=false; return; }
      const guru = await checkGuru(extra, pin);
      if (guru) {
        sessionStorage.setItem('cms_role', 'guru');
        sessionStorage.setItem('cms_guru_id', guru.id);
        sessionStorage.setItem('cms_guru_nama', guru.nama);
        window.location.href = 'guru.html';
      } else {
        showErr('Identitas atau PIN guru tidak cocok');
      }
    }
  } catch(e) {
    showErr('Gagal terhubung. Cek koneksi atau konfigurasi API.');
  }

  btn.textContent = 'Masuk'; btn.disabled = false;
}

function showErr(msg) {
  const el = document.getElementById('errMsg');
  el.textContent = msg; el.classList.add('show');
}

// ── Auth helpers ─────────────────────────────────────────────────────────────
async function checkAdmin(pin) {
  if (!API_URL) {
    // Demo mode
    return pin === (localStorage.getItem('cms_admin_pin') || '1234');
  }
  const r = await fetch(API_URL + '?action=check_admin&pin=' + encodeURIComponent(pin));
  const d = await r.json();
  return d.ok === true;
}

async function checkGuru(query, pin) {
  if (!API_URL) {
    // Demo mode: cek dari localStorage
    const list = JSON.parse(localStorage.getItem('cms_guru') || '[]');
    return list.find(g =>
      (g.email?.toLowerCase() === query.toLowerCase() ||
       g.nama?.toLowerCase().includes(query.toLowerCase())) &&
      g.pin === pin
    ) || null;
  }
  const r = await fetch(API_URL + `?action=check_guru&query=${encodeURIComponent(query)}&pin=${encodeURIComponent(pin)}`);
  const d = await r.json();
  return d.guru || null;
}

</script>
</body>
</html>
